# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click: push this repo, then create a Blueprint on Render.
# SQLite lives on the service's local filesystem. The free plan is ephemeral;
# attach a persistent disk for durable orders (see README).
services:
  - type: web
    name: smartdine-danieljosephm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_MODE
        value: demo
